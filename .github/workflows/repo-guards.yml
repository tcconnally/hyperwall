name: repo-guards

# The repository targets macOS. CI exercises pure logic and syntax; Qt/libmpv
# and VideoToolbox behavior still require the operator's MacBook Air soak host.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all test suites
        run: python tests/run_all.py
      - name: Compile source and tests
        run: python -m compileall -q hyperwall tests
